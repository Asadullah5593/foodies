# CI on every PR to main and on every push to main.
# Deploy to production runs only after a successful push to main (e.g. after you merge a PR).

name: CI and production deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# PRs: cancel superseded runs. main: queue (do not cancel an in-flight production deploy).
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  consumer-web:
    name: Consumer web (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumer-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: consumer-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, frontend, consumer-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_REPO_PATH
          script: |
            set -euo pipefail
            REPO="${DEPLOY_REPO_PATH:-$HOME/foodies}"

            # `npm ci` on this host intermittently aborts mid-reify with
            # "ENOTEMPTY: rmdir .../node_modules/<pkg>/node_modules/<dep>/dist" (a known npm race /
            # stale-cache issue). Wipe node_modules, and on failure clean the npm cache and retry
            # once, so a transient install error doesn't fail the whole deploy.
            npm_ci() {
              rm -rf node_modules
              if ! npm ci "$@"; then
                echo "npm ci failed (ENOTEMPTY or similar) - wiping node_modules + npm cache and retrying once..."
                rm -rf node_modules
                npm cache clean --force || true
                npm ci "$@"
              fi
            }

            cd "$REPO"
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            # Backend
            cd "$REPO/backend"
            npm_ci --legacy-peer-deps
            npm run build
            pm2 restart foodies-backend --update-env

            # Frontend (admin/POS) -> served from /var/www/foodies
            cd "$REPO/frontend"
            npm_ci
            npm run build
            sudo rsync -a --delete dist/ /var/www/foodies/

            # Consumer web
            cd "$REPO/consumer-web"
            rm -rf .next
            npm_ci
            npm run build
            pm2 restart website --update-env

            echo "Deploy finished OK."
