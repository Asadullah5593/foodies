# CI on every PR to main and on every push to main.
# Deploy to production runs only after a successful push to main (e.g. after you merge a PR).

name: CI and production deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# PRs: cancel superseded runs. main: queue (do not cancel an in-flight production deploy).
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  consumer-web:
    name: Consumer web (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumer-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: consumer-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, frontend, consumer-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_REPO_PATH
          script: |
            set -euo pipefail
            REPO="${DEPLOY_REPO_PATH:-$HOME/foodies}"
            cd "$REPO"
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            cd "$REPO/backend"
            npm ci --legacy-peer-deps
            npm run build
            pm2 restart foodies-backend
            cd "$REPO/frontend"
            npm ci
            printf '%s\n' 'VITE_API_URL=/api' > .env.production
            npm run build
            sudo rsync -a --delete dist/ /var/www/foodies/
            sudo chown -R www-data:www-data /var/www/foodies
            sudo chmod -R 755 /var/www/foodies
            sudo systemctl reload nginx
            curl -fsS http://127.0.0.1/api/ >/dev/null
            echo "Deploy finished OK."
